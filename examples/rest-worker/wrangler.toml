name = "google-maps-rest-worker-example"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[observability]
enabled = true
head_sampling_rate = 1.0

# GOOGLE_MAPS_API_KEY is a secret, not a plaintext var:
#   - local dev: written to .dev.vars by `mise run worker:dev` (from fnox/keychain)
#   - prod:      `fnox exec -- wrangler secret put GOOGLE_MAPS_API_KEY`

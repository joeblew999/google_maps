syntax = "proto3";

// A slim, typed ConnectRPC facade over the `google_maps` crate's Cloudflare
// Workers transport. Intentionally exposes only the fields a typed client (e.g.
// a React app) usually needs — NOT the full Google response shapes. Widen the
// messages here as your UI needs more fields.
package maps.v1;

service MapsService {
  // Forward geocoding: address string -> coordinates + formatted address.
  rpc Geocode(GeocodeRequest) returns (GeocodeResponse);

  // Reverse geocoding: coordinates -> formatted addresses.
  rpc ReverseGeocode(ReverseGeocodeRequest) returns (ReverseGeocodeResponse);

  // Directions: origin + destination -> route summaries (distance/duration).
  rpc Directions(DirectionsRequest) returns (DirectionsResponse);

  // Elevation: coordinates -> elevation (metres).
  rpc Elevation(ElevationRequest) returns (ElevationResponse);

  // Time zone: coordinates (+ optional unix timestamp) -> tz id/name/offsets.
  rpc TimeZone(TimeZoneRequest) returns (TimeZoneResponse);

  // Places (New) Text Search: free-text query -> matching places.
  rpc TextSearch(TextSearchRequest) returns (TextSearchResponse);

  // Distance Matrix: N origins x M destinations -> per-pair distance/duration.
  // Origins/destinations are coordinates (geocode addresses first via Geocode).
  rpc DistanceMatrix(DistanceMatrixRequest) returns (DistanceMatrixResponse);

  // Places (New) Autocomplete: partial input -> address/place predictions.
  rpc PlacesAutocomplete(PlacesAutocompleteRequest) returns (PlacesAutocompleteResponse);

  // Places (New) Nearby Search: center + radius -> nearby places.
  rpc PlacesNearby(PlacesNearbyRequest) returns (PlacesNearbyResponse);
}

// A WGS84 coordinate, used by requests that take a list of points.
message LatLng {
  double latitude = 1;
  double longitude = 2;
}

message GeocodeRequest {
  string address = 1;
}

message GeocodeResponse {
  repeated GeoResult results = 1;
  // Google's status string (e.g. "OK", "ZERO_RESULTS", "REQUEST_DENIED").
  string status = 2;
}

message GeoResult {
  string formatted_address = 1;
  double latitude = 2;
  double longitude = 3;
}

message ReverseGeocodeRequest {
  double latitude = 1;
  double longitude = 2;
}

message ReverseGeocodeResponse {
  repeated GeoResult results = 1;
  string status = 2;
}

message DirectionsRequest {
  string origin = 1;
  string destination = 2;
}

message DirectionsResponse {
  repeated Route routes = 1;
  string status = 2;
}

message Route {
  string summary = 1;
  string distance = 2;       // e.g. "450 km" (first leg) — display string
  string duration = 3;       // e.g. "4 hours 30 mins" (first leg) — display string
  string start_address = 4;
  string end_address = 5;
  uint32 distance_meters = 6;   // numeric, for sums/comparisons (first leg)
  int64 duration_seconds = 7;   // numeric, for sums/comparisons (first leg)
}

message ElevationRequest {
  double latitude = 1;
  double longitude = 2;
}

message ElevationResponse {
  repeated ElevationResult results = 1;
}

message ElevationResult {
  double elevation = 1;   // metres above sea level
  double latitude = 2;
  double longitude = 3;
  double resolution = 4;  // metres between sample points
}

message TimeZoneRequest {
  double latitude = 1;
  double longitude = 2;
  int64 timestamp_seconds = 3;  // unix seconds; <=0 uses a server default
}

message TimeZoneResponse {
  string time_zone_id = 1;       // e.g. "America/Toronto"
  string time_zone_name = 2;     // e.g. "Eastern Daylight Time"
  int32 raw_offset_seconds = 3;
  int32 dst_offset_seconds = 4;
  string status = 5;
}

message TextSearchRequest {
  string query = 1;
}

message TextSearchResponse {
  repeated Place places = 1;
}

message Place {
  string display_name = 1;
  string formatted_address = 2;
  double latitude = 3;     // so a client can drop a map pin
  double longitude = 4;
  string place_id = 5;     // stable id for follow-up lookups
}

message DistanceMatrixRequest {
  repeated LatLng origins = 1;
  repeated LatLng destinations = 2;
}

message DistanceMatrixResponse {
  // One row per origin; within a row, one element per destination (same order).
  repeated DistanceMatrixRow rows = 1;
  string status = 2;
}

message DistanceMatrixRow {
  repeated DistanceMatrixElement elements = 1;
}

message DistanceMatrixElement {
  uint32 distance_meters = 1;
  int64 duration_seconds = 2;
  string status = 3;   // per-pair status (e.g. "Ok", "ZeroResults", "NotFound")
}

message PlacesAutocompleteRequest {
  string input = 1;
}

message PlacesAutocompleteResponse {
  repeated Prediction predictions = 1;
}

message Prediction {
  string description = 1;   // human-readable suggestion text
  string place_id = 2;      // feed into a follow-up geocode/details call
}

message PlacesNearbyRequest {
  double latitude = 1;
  double longitude = 2;
  double radius_meters = 3;
}

message PlacesNearbyResponse {
  repeated Place places = 1;
}

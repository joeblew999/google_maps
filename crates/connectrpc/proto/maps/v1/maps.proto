syntax = "proto3";

// A slim, typed ConnectRPC facade over the `google_maps` crate's Cloudflare
// Workers transport. Intentionally exposes only the fields a typed client (e.g.
// a React app) usually needs — NOT the full Google response shapes. Widen the
// messages here as your UI needs more fields.
package maps.v1;

service MapsService {
  // Forward geocoding: address string -> coordinates + formatted address.
  rpc Geocode(GeocodeRequest) returns (GeocodeResponse);

  // Places (New) Text Search: free-text query -> matching places.
  rpc TextSearch(TextSearchRequest) returns (TextSearchResponse);
}

message GeocodeRequest {
  string address = 1;
}

message GeocodeResponse {
  repeated GeoResult results = 1;
  // Google's status string (e.g. "OK", "ZERO_RESULTS", "REQUEST_DENIED").
  string status = 2;
}

message GeoResult {
  string formatted_address = 1;
  double latitude = 2;
  double longitude = 3;
}

message TextSearchRequest {
  string query = 1;
}

message TextSearchResponse {
  repeated Place places = 1;
}

message Place {
  string display_name = 1;
  string formatted_address = 2;
}

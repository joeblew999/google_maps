[package]
name = "google-maps-connectrpc"
version = "0.1.0"
edition = "2021"
description = "Reusable ConnectRPC facade over the google_maps Cloudflare Workers transport. Link this from any workers-rs project to expose Google Maps over typed Connect RPCs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeblew999/google_maps"
publish = false

[package.metadata]

[package.metadata.cargo-machete]
ignored = ["buffa", "bytes", "http", "http-body", "http-body-util", "serde", "uuid"]

[lib]
crate-type = ["rlib"]

# One proto, three roles:
#   SERVER (embeds google_maps) — pick one transport:
#     worker  → google_maps' wasm `worker::Fetch` (Cloudflare)
#     native  → google_maps' `reqwest`           (native, e.g. axum)
#   CLIENT (does NOT pull google_maps) — for workers/projects that CALL the maps
#     service over Connect RPC, keeping their deployment tiny:
#     client  → the generated `MapsServiceClient` + proto types only
[features]
default = ["worker"]

# --- server roles (embed google_maps) ---
# `dep:uuid` (js backend) is worker-only: places-new-autocomplete pulls `uuid`,
# which needs getrandom's wasm `js` backend. Native uses the OS RNG (no js dep);
# the tiny `client` role pulls neither google_maps nor uuid.
worker = ["_server", "dep:worker", "dep:uuid", "google_maps/worker"]
native = ["_server", "google_maps/reqwest", "google_maps/reqwest-default-tls"]
_server = [
    "dep:google_maps",
    "dep:chrono",
    "dep:tower",
    "dep:pin-project-lite",
    "google_maps/geocoding",
    "google_maps/directions",
    "google_maps/distance_matrix",
    "google_maps/elevation",
    "google_maps/time_zone",
    "google_maps/places-new-core",
    "google_maps/places-new-text-search",
    "google_maps/places-new-autocomplete",
    "google_maps/places-new-nearby-search",
]

# --- client role (no google_maps) ---
client = []

[dependencies]
# Only present for the SERVER roles; the `client` role never pulls it (size win).
google_maps = { path = "../..", default-features = false, optional = true }

# ConnectRPC runtime = anthropics/connect-rust (the `connectrpc` crate). 0.6.x
# is the latest; it serves both natively (axum) and on CF Workers from one crate.
connectrpc = { version = "0.6", default-features = false }
buffa      = { version = "0.6", features = ["json"] }

# Workers runtime (only on the `worker` target — for `IntoSendFuture`).
worker = { version = "0.8", features = ["http"], optional = true }

# HTTP plumbing referenced by the generated connectrpc service code.
http           = "1"
http-body      = "1"
http-body-util = "0.1"
bytes          = "1.5"

# Decimal → f64 for coordinate conversion.
rust_decimal = { version = "1", default-features = false }

# Server-only: build the timestamp for the Time Zone RPC.
chrono = { version = "0.4", optional = true, default-features = false }

# Server-only: the Bearer-token auth tower::Layer (token_auth).
tower            = { version = "0.5", optional = true, default-features = false }
pin-project-lite = { version = "0.2", optional = true }

# Worker-only: not used directly — present so the transitive `uuid` (pulled by
# places-new-autocomplete) gets getrandom's wasm `js` backend. See the `worker`
# feature. Native/client roles never enable it.
uuid = { version = "1", features = ["js", "v4"], optional = true }

# The buffa `json` codegen emits serde derives on the generated messages.
serde      = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = { version = "0.6" }

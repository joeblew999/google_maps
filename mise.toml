[tools]
rust = "stable"
"aqua:nushell/nushell" = "latest"

# Node runtime — required by the npm-based wrangler CLI below.
node = "24"

# Python — ONLY here to satisfy the Google Cloud SDK's runtime (it needs Python
# >= 3.10; macOS ships 3.9). Not used for any project code. See CLOUDSDK_PYTHON.
python = "3.13"

# Google Cloud SDK — used to provision a restricted Google Maps API key on demand
# (see `secret:google` / `gcloud:login`), so you never touch the Cloud Console.
# Pinned to the asdf backend; the vfox backend's installer is broken on macOS.
"asdf:mise-plugins/mise-gcloud" = "latest"

# pnpm — web workspace package manager (web/).
"npm:pnpm" = "10.15.0"

# Cloudflare Workers CLI: dev + deploys for the example worker. Drives worker-build.
"npm:wrangler" = "4.97.0"

# Rust → wasm32 bundler invoked by wrangler.
"cargo:worker-build" = "latest"

# buf — proto lint + TS codegen for the ConnectRPC layer.
"aqua:bufbuild/buf" = "latest"

# protoc — required by connectrpc-build to compile the ConnectRPC layer's .proto.
"aqua:protocolbuffers/protobuf/protoc" = "latest"

# Dev-quality tools.
"cargo:cargo-machete" = "latest"

# Pitchfork: process supervisor for dev daemons.
"aqua:jdx/pitchfork" = "latest"

[env]
WASM_TARGET = "wasm32-unknown-unknown"
RUST_BACKTRACE = "1"

# Force the Google Cloud SDK to use mise's modern Python (its bundled bootstrap
# fails under macOS's system Python 3.9). Points at the mise python shim, which
# resolves to the `python` tool declared above when run from this repo.
CLOUDSDK_PYTHON = "{{env.HOME}}/.local/share/mise/shims/python3"

# Feature set used for the wasm32 / workers-rs port checks. This is the
# VERIFIED-good set that compiles clean for wasm32 with no native transport
# (geocoding + directions + Places-New text search). Do NOT add the `places-new`
# umbrella or autocomplete/place-details — they pull `uuid` v4, which hard-errors
# on wasm32 without a `js` RNG. Widen only with a confirmed wasm build.
WASM_FEATURES = "address_validation,directions,distance_matrix,elevation,geocoding,roads,time_zone,places-new-core,places-new-nearby-search,places-new-place-photos,places-new-text-search,decimal-serde"

# Google Maps Platform service IDs the provisioned key is enabled for + restricted
# to. MUST mirror WASM_FEATURES (every API the worker can call), else the key
# blocks the un-listed ones. Service IDs verified via `gcloud services list`:
#   geocoding (fwd+rev) -> geocoding-backend       directions      -> directions-backend
#   distance_matrix     -> distance-matrix-backend elevation       -> elevation-backend
#   time_zone           -> timezone-backend        roads           -> roads.googleapis.com
#   address_validation  -> addressvalidation        places-new (all)-> places.googleapis.com
GOOGLE_MAPS_SERVICES = "geocoding-backend.googleapis.com directions-backend.googleapis.com distance-matrix-backend.googleapis.com elevation-backend.googleapis.com timezone-backend.googleapis.com roads.googleapis.com addressvalidation.googleapis.com places.googleapis.com"

# Display name for the provisioned API key + the GCP project (non-secret default).
GOOGLE_MAPS_KEY_DISPLAY_NAME = "google_maps-rust-fork"

# The deterministic GCP target (project id, account, billing account) is NOT
# committed — it lives in your keychain via fnox (see fnox.toml: GCP_*). Set it
# once with `mise run gcloud:setup`, which creates the project if needed.


# =============================================================================
# mise:* — bootstrap
# =============================================================================

[tasks."mise:install"]
description = "Install every CLI tool declared above + the wasm32 target"
shell = "nu -c"
run = '''
mise install
rustup target add wasm32-unknown-unknown
'''


# =============================================================================
# upstream:* — keep the fork in sync with leontoeides/google_maps
# =============================================================================

[tasks."upstream:fetch"]
hide = true
description = "Fetch upstream (leontoeides/google_maps) refs"
shell = "nu -c"
run = "git fetch upstream"

[tasks."upstream:sync"]
hide = true
description = "Merge upstream/master into the current branch (review before pushing)"
shell = "nu -c"
run = '''
git fetch upstream
git merge upstream/master
'''


# =============================================================================
# cargo:* — Rust dev loop
# =============================================================================

[tasks."cargo:check"]
hide = true
description = "cargo check, native target, default features (upstream sanity)"
shell = "nu -c"
run = "cargo check"

[tasks."cargo:check:wasm"]
hide = true
description = "cargo check against wasm32 with the port feature set (no native reqwest)"
shell = "nu -c"
run = "cargo check --target $env.WASM_TARGET --no-default-features --features $env.WASM_FEATURES"

[tasks."cargo:build:wasm"]
hide = true
description = "Build the library for wasm32 (release, port feature set)"
shell = "nu -c"
run = "cargo build --target $env.WASM_TARGET --release --no-default-features --features $env.WASM_FEATURES"

[tasks."cargo:test"]
hide = true
description = "Run native tests"
shell = "nu -c"
run = "cargo test"

[tasks."cargo:lint"]
hide = true
description = "Lint with clippy against wasm32, port feature set (deny warnings)"
shell = "nu -c"
run = "cargo clippy --target $env.WASM_TARGET --no-default-features --features $env.WASM_FEATURES -- -D warnings"

[tasks."cargo:format"]
hide = true
description = "Apply rustfmt to all sources"
shell = "nu -c"
run = "cargo fmt --all"

[tasks."cargo:machete"]
hide = true
description = "Find unused dependencies"
shell = "nu -c"
run = "cargo machete"

[tasks."cargo:pre-commit"]
hide = true
description = "Format + wasm lint + native test + machete (run before every commit)"
depends = ["cargo:format", "cargo:lint", "cargo:test", "cargo:machete"]


# =============================================================================
# cf:* — Cloudflare auth (for the example worker)
# =============================================================================

[tasks."cf:check"]
hide = true
description = "Verify CF auth (whoami)"
shell = "nu -c"
run = "fnox exec -- wrangler whoami"


# =============================================================================
# example:* — the simple REST example (examples/cf-rest-worker) that exercises the transport
# =============================================================================

[tasks."example:build"]
hide = true
description = "Build the example worker to wasm (worker-build, release)"
dir = "examples/cf-rest-worker"
shell = "nu -c"
run = "worker-build --release"

[tasks."example:dev"]
description = "Run the example worker locally. Ensures the API key exists, writes .dev.vars from fnox, then starts wrangler dev."
dir = "examples/cf-rest-worker"
shell = "nu -c"
depends = ["secret:google"]
run = '''
fnox exec -- nu -c '$"GOOGLE_MAPS_API_KEY=($env.GOOGLE_MAPS_API_KEY)" | save -f .dev.vars'
wrangler dev --local
'''

[tasks."example:deploy"]
description = "Deploy the example worker. Set the secret first: fnox exec -- wrangler secret put GOOGLE_MAPS_API_KEY"
dir = "examples/cf-rest-worker"
shell = "nu -c"
run = "fnox exec -- wrangler deploy"

[tasks."example:connectrpc:dev"]
description = "Run the ConnectRPC example worker locally (typed Connect RPCs over the maps transport)."
dir = "examples/cf-connectrpc-worker"
shell = "nu -c"
depends = ["secret:google"]
run = '''
# Local dev token (the worker now requires Authorization: Bearer <token>).
fnox exec -- nu -c '$"GOOGLE_MAPS_API_KEY=($env.GOOGLE_MAPS_API_KEY)\nMAPS_TOKENS=dev-token\n" | save -f .dev.vars'
print "── ConnectRPC worker (local) ─────────────────────────────"
print "  http://localhost:8787   header:  Authorization: Bearer dev-token"
print "──────────────────────────────────────────────────────────"
wrangler dev --local
'''

[tasks."example:connectrpc:deploy"]
description = "Deploy the ConnectRPC example worker. Set the secret first: fnox exec -- wrangler secret put GOOGLE_MAPS_API_KEY"
dir = "examples/cf-connectrpc-worker"
shell = "nu -c"
run = "fnox exec -- wrangler deploy"

[tasks."example:connectrpc:client:dev"]
description = "Run the Cloudflare CLIENT example worker (binds over RPC, no google_maps). Set MAPS_URL to the maps worker (default http://localhost:8787)."
dir = "examples/cf-connectrpc-client-worker"
shell = "nu -c"
run = "wrangler dev --local"

[tasks."example:native:dev"]
description = "Run the native (axum) ConnectRPC server locally. Ensures the API key, exports it, then serves on 127.0.0.1:8080."
dir = "examples/native-connectrpc"
shell = "nu -c"
depends = ["secret:google"]
run = "fnox exec -- cargo run --release"


# =============================================================================
# secret:* — fnox-managed secrets (keychain). See [[feedback_secrets_fnox_mise]]
# =============================================================================

[tasks."gcloud:setup"]
description = "Deterministic gcloud target: ensures auth, CREATES the GCP project if needed, and pins project + account into fnox. Idempotent."
shell = "nu -c"
run = '''
# 1. Ensure an authenticated account.
let active = (^gcloud auth list --filter=status:ACTIVE --format="value(account)" | complete)
mut account = ($active.stdout | str trim)
if ($account | is-empty) {
    print "No active gcloud account — launching browser login…"
    ^gcloud auth login
    let a2 = (^gcloud auth list --filter=status:ACTIVE --format="value(account)" | complete)
    $account = ($a2.stdout | str trim)
}
print $"Active account: ($account)"

# 2. Resolve the target project id deterministically. Priority: pinned fnox
#    GCP_PROJECT_ID, else DERIVED from the git repo as `<owner>-<repo>` (so the
#    project matches the repo name, like the GOOGLE_MAPS_* secret prefix does).
let remote = (do --ignore-errors { ^git remote get-url origin } | complete)
let slug = ($remote.stdout | str trim | str replace --regex '^.*github\.com[:/]' '' | str replace --regex '\.git$' '')
let owner = ($slug | split row "/" | first)
# Project DISPLAY name = the repo name (lowercased, '_'->'-'; display names
# disallow underscores). This is the "project name matches the repo" part.
let repo_name = ($slug | split row "/" | last | str downcase | str replace --all "_" "-")
# Project ID may NOT contain the prohibited word "google", so collapse it to 'g'
# (e.g. google-maps -> gmaps). Owner-prefixed for global uniqueness.
let id_repo = ($repo_name | str replace --all "google-" "g" | str replace --all "google" "g")
let derived_id = (if ($slug | str contains "/") { $"($owner)-($id_repo)" } else { $id_repo })

let want = (^fnox get GCP_PROJECT_ID | complete)
mut project = (if $want.exit_code == 0 { $want.stdout | str trim } else { $derived_id })

if ($project | is-empty) {
    print "✗ Could not resolve a project id (no fnox pin, no git remote) — set one with `fnox set -p keychain GCP_PROJECT_ID <id>`."
} else {
    print $"Target project id: ($project)  [repo-derived default: ($derived_id)]"
    let pname = (if ($repo_name | is-empty) { $project } else { $repo_name })
    # 3. Create the project if it does not already exist; keep its display name in sync.
    mut ok = false
    let exists = (^gcloud projects describe $project --format="value(projectId)" | complete)
    if $exists.exit_code == 0 {
        print $"✓ project ($project) already exists."
        ^gcloud projects update $project --name $pname out+err> /dev/null
        print $"  display name set to ($pname)."
        $ok = true
    } else {
        print $"Creating project ($project) \(name: ($pname)\)…"
        let created = (^gcloud projects create $project --name $pname | complete)
        if $created.exit_code == 0 {
            print $"✓ created project ($project)."
            $ok = true
        } else {
            print $"✗ project creation failed \(project ids must be globally unique\):"
            print ($created.stderr | str trim | lines | first 3 | str join (char nl))
        }
    }

    if not $ok {
        print "✗ Project unavailable — pick a different id and re-run `mise run gcloud:setup`."
    } else {
        # 4. Pin project + account into fnox so every later step is deterministic.
        ^fnox set -p keychain GCP_PROJECT_ID $project
        if ($account | is-not-empty) { ^fnox set -p keychain GCP_ACCOUNT $account }
        ^gcloud config set project $project out+err> /dev/null
        print $"✓ pinned GCP_PROJECT_ID + GCP_ACCOUNT in fnox; gcloud default project = ($project)."

        # 5. Billing: Maps API *calls* need an OPEN billing account (provisioning
        #    a key does not). IMPORTANT: only link an OPEN account — attaching a
        #    CLOSED one explicitly disables billing and blocks ALL Maps APIs.
        let billing = (^fnox get GCP_BILLING_ACCOUNT | complete)
        if $billing.exit_code == 0 {
            let ba = ($billing.stdout | str trim)
            let desc = (^gcloud billing accounts describe $ba --format "value(open)" | complete)
            if (($desc.stdout | str trim) == "True") {
                print $"Linking OPEN billing account ($ba)…"
                ^gcloud billing projects link $project --billing-account $ba out+err> /dev/null
                print "✓ billing linked + enabled."
            } else {
                print $"⚠ pinned billing account ($ba) is CLOSED — NOT linking; a closed account blocks all Maps APIs."
                print "  Reopen it at https://console.cloud.google.com/billing then re-run `mise run gcloud:setup`."
            }
        } else {
            print "ℹ No GCP_BILLING_ACCOUNT pinned. Maps API *calls* need an OPEN billing account; provisioning a key does not."
            print "  To link later: fnox set -p keychain GCP_BILLING_ACCOUNT <ACCOUNT_ID>  (see: gcloud billing accounts list)"
        }
        print "Next: mise run secret:google"
    }
}
'''

[tasks."secret:google"]
description = "Ensure GOOGLE_MAPS_API_KEY is in fnox. NO-OP if already set; otherwise auto-provisions a restricted key via gcloud (falls back to manual paste)."
shell = "nu -c"
run = '''
# `fnox get` exits 0 when the secret resolves, 1 when absent. `complete` captures
# stdout/stderr/exit_code WITHOUT printing them, so the value never leaks.
let probe = (^fnox get GOOGLE_MAPS_API_KEY | complete)
if $probe.exit_code == 0 {
    print "✓ GOOGLE_MAPS_API_KEY already set in fnox (keychain) — nothing to do."
} else {
    print "GOOGLE_MAPS_API_KEY is not set. Trying automated provisioning via gcloud…"
    mut key = ""

    if (which gcloud | is-empty) {
        print "  gcloud not found (run `mise install`)."
    } else {
        # Deterministic target: project + account come from fnox (pinned by
        # `gcloud:setup`), NOT from ambient `gcloud config`.
        let proj = (^fnox get GCP_PROJECT_ID | complete)
        if $proj.exit_code != 0 {
            print "  No pinned GCP project — run `mise run gcloud:setup` first (it creates one if needed)."
        } else {
            let project = ($proj.stdout | str trim)
            let acct = (^fnox get GCP_ACCOUNT | complete)
            if $acct.exit_code == 0 {
                $env.CLOUDSDK_CORE_ACCOUNT = ($acct.stdout | str trim)
            }
            $env.CLOUDSDK_CORE_PROJECT = $project
            print $"  Using pinned project: ($project)"

            # The API Keys API must be enabled before we can mint keys, plus the
            # Maps services the key is restricted to.
            let services = ($env.GOOGLE_MAPS_SERVICES | split row " " | where {|s| ($s | str trim | is-not-empty)})
            for s in (["apikeys.googleapis.com"] | append $services) {
                print $"  Enabling ($s)…"
                let en = (^gcloud services enable $s --project $project | complete)
                if $en.exit_code != 0 {
                    print $"    ⚠ could not enable ($s) \(continuing — Maps APIs usually need billing\): ($en.stderr | str trim | lines | first)"
                }
            }
            # One --api-target per service so the key is RESTRICTED to only the
            # Maps APIs we use (can't be hijacked for other billing).
            let api_targets = ($services | each {|s| $"--api-target=service=($s)"})
            let display = $env.GOOGLE_MAPS_KEY_DISPLAY_NAME

            # Idempotent: reuse an existing key with our display name, else create
            # one. (`api-keys create` returns an OPERATION; the key resource is in
            # `response.name`, so we must NOT use plain `name`.)
            let listed = (^gcloud services api-keys list --project $project --filter $"displayName=($display)" --format "value(name)" | complete)
            let found = ($listed.stdout | str trim | lines | where {|l| ($l | str trim | is-not-empty)})
            mut key_name = (if ($found | is-empty) { "" } else { $found | first })

            if ($key_name | is-empty) {
                print "  Creating restricted API key…"
                let created = (^gcloud services api-keys create --display-name $display --project $project ...$api_targets --format "value(response.name)" | complete)
                if $created.exit_code != 0 {
                    print $"  ✗ key creation failed: ($created.stderr | str trim | lines | first)"
                } else {
                    $key_name = ($created.stdout | str trim)
                }
            } else {
                print "  Reusing existing restricted key."
            }

            if ($key_name | is-not-empty) {
                let fetched = (^gcloud services api-keys get-key-string $key_name --project $project --format "value(keyString)" | complete)
                if $fetched.exit_code == 0 {
                    $key = ($fetched.stdout | str trim)
                    print "  ✓ provisioned a restricted key via gcloud."
                } else {
                    print $"  ✗ fetching key string failed: ($fetched.stderr | str trim | lines | first)"
                }
            }
        }
    }

    if ($key | is-empty) {
        print "Falling back to manual entry — create a key at:"
        print "  https://console.cloud.google.com/google/maps-apis/credentials"
        $key = (input --suppress-output "Paste your Google Maps API key (hidden): " | str trim)
        print ""
    }

    if ($key | is-empty) {
        print "✗ No key obtained — aborting without changes."
    } else {
        # `-p keychain` is mandatory: without it fnox inlines the value as
        # plaintext into fnox.toml instead of storing it in the keychain.
        ^fnox set -p keychain GOOGLE_MAPS_API_KEY $key
        print "✓ Saved GOOGLE_MAPS_API_KEY to keychain via fnox."
    }
}
'''


# =============================================================================
# gcloud:billing:* — Google Cloud billing control (Maps API CALLS need an OPEN account)
# =============================================================================

[tasks."gcloud:billing:list"]
description = "List your GCP billing accounts with OPEN status, so you can pick one for `gcloud:billing:use`."
shell = "nu -c"
run = '^gcloud billing accounts list --format="table(name,displayName,open)"'

[tasks."gcloud:billing:status"]
description = "Show the pinned project's billing account + whether billing is actually enabled."
shell = "nu -c"
run = '''
let proj = (^fnox get GCP_PROJECT_ID | complete)
if $proj.exit_code != 0 {
    print "No pinned project — run `mise run gcloud:setup` first."
} else {
    let p = ($proj.stdout | str trim)
    print $"Project: ($p)"
    ^gcloud billing projects describe $p --format "yaml(billingAccountName,billingEnabled)"
    let pin = (^fnox get GCP_BILLING_ACCOUNT | complete)
    if $pin.exit_code == 0 { print $"Pinned GCP_BILLING_ACCOUNT: ($pin.stdout | str trim)" } else { print "Pinned GCP_BILLING_ACCOUNT: (none)" }
}
'''

[tasks."gcloud:billing:use"]
description = "Flip the project to a billing account: pick from a list, pin it in fnox, and link it (only if OPEN). This is the easy 'turn Maps APIs on' button."
shell = "nu -c"
run = '''
print "Your billing accounts:"
^gcloud billing accounts list --format "table(name,displayName,open)"
let acct = (input "Billing account ID to use (e.g. 0X0X0X-XXXXXX-XXXXXX): " | str trim)
if ($acct | is-empty) {
    print "✗ No account id — aborting."
} else {
    let proj = (^fnox get GCP_PROJECT_ID | complete)
    if $proj.exit_code != 0 {
        print "✗ No pinned project — run `mise run gcloud:setup` first."
    } else {
        let p = ($proj.stdout | str trim)
        ^fnox set -p keychain GCP_BILLING_ACCOUNT $acct
        print $"✓ pinned GCP_BILLING_ACCOUNT = ($acct)."
        let open = (^gcloud billing accounts describe $acct --format "value(open)" | complete)
        if (($open.stdout | str trim) == "True") {
            ^gcloud billing projects link $p --billing-account $acct out+err> /dev/null
            print $"✓ linked + billing ENABLED for ($p). Maps APIs are live."
        } else {
            print $"⚠ account ($acct) is CLOSED — pinned but NOT linked; linking a closed account blocks all Maps APIs."
            print "  Reopen/create one with `mise run gcloud:billing:open`, then re-run `mise run gcloud:billing:use`."
        }
    }
}
'''

[tasks."gcloud:billing:open"]
description = "Open the GCP billing console to create or reopen a billing account (the one step the CLI can't do)."
shell = "nu -c"
run = 'start "https://console.cloud.google.com/billing"'

[tasks."gcloud:billing:unlink"]
hide = true
description = "Unlink the billing account from the pinned project (e.g. to undo a closed-account link)."
shell = "nu -c"
run = '''
let proj = (^fnox get GCP_PROJECT_ID | complete)
if $proj.exit_code != 0 { print "No pinned project." } else {
    ^gcloud billing projects unlink ($proj.stdout | str trim) out+err> /dev/null
    print "✓ unlinked."
}
'''


# =============================================================================
# test:* — native + Cloudflare verification
# =============================================================================

[tasks."test"]
description = "Full suite: native unit tests + the Cloudflare (wasm32) build gate"
depends = ["test:native", "test:cf"]

[tasks."test:native"]
hide = true
description = "Native unit tests (default reqwest features). 256 target-agnostic tests covering the shared types/serde/query-building used by BOTH transports."
shell = "nu -c"
run = "cargo test"

[tasks."test:cf"]
hide = true
description = "Cloudflare build gate: compile the lib AND the example worker for wasm32 with the worker transport (no reqwest/tokio timers)."
shell = "nu -c"
run = '''
cargo build --target $env.WASM_TARGET --no-default-features --features $"worker,($env.WASM_FEATURES)"
cargo build -p google-maps-connectrpc --target $env.WASM_TARGET
cd examples/cf-rest-worker
cargo build --target $env.WASM_TARGET --release
cd ../connectrpc-worker
cargo build --target $env.WASM_TARGET --release
'''

[tasks."test:cf-smoke"]
description = "Live Cloudflare smoke test for EVERY API: boots `wrangler dev` with a DUMMY key and asserts each route's worker::Fetch transport reaches Google (denied/billing/invalid — proves round-trip). Needs network. Opt-in; not part of `test`."
dir = "examples/cf-rest-worker"
shell = "nu -c"
run = '''
let log = "/tmp/gmaps-cf-smoke.log"
"GOOGLE_MAPS_API_KEY=cf-smoke-dummy-key" | save -f .dev.vars
rm -f $log

# One route per API. With a dummy key each must come back with a Google-side
# rejection (denied / invalid / billing / permission), which proves the request
# left the worker via worker::Fetch and Google answered.
let routes = [
    "geocode?address=Ottawa"
    "reverse?lat=45.42&lng=-75.69"
    "directions?origin=Ottawa&destination=Toronto"
    "distance-matrix"
    "elevation"
    "time-zone"
    "snap-to-roads"
    "nearest-roads"
    "text-search?query=pizza"
    "autocomplete?input=piz"
    "nearby-search"
    "place-details"
    "validate-address"
]
let tokens = ["denied" "api key" "api_key" "permission" "invalid" "billing" "quota" "not authorized" "blocked"]

# Snapshot workerd PIDs so teardown only kills the ones THIS run spawns.
let workerd_before = (ps | where name =~ "workerd" | get pid)
let id = (job spawn { ^wrangler dev --local --port 8799 out+err> $log })

mut ready = false
for _ in 1..90 {
    sleep 1sec
    if ($log | path exists) and ((open $log) | str contains "Ready on") { $ready = true; break }
}

mut failures = []
if not $ready {
    $failures = ["wrangler dev never became ready"]
} else {
    for r in $routes {
        let name = ($r | split row "?" | first)
        let body = (^curl -s --max-time 30 $"http://localhost:8799/($r)")
        let low = ($body | str downcase)
        let reached = ($tokens | any {|t| $low | str contains $t})
        if $reached {
            print $"  ✓ ($name)"
        } else {
            print $"  ✗ ($name)"
            $failures = ($failures | append $"($name): (($body | str substring 0..140))")
        }
    }
}

# Teardown: stop the job, reap workerd children by PID diff, then belt-and-suspenders
# kill anything still bound to this run's port.
job kill $id
let workerd_after = (ps | where name =~ "workerd" | get pid)
$workerd_after | where {|p| $p not-in $workerd_before} | each {|p| do --ignore-errors { ^kill -9 $p } }
do --ignore-errors { ^pkill -f "localhost:8799" }
rm -f .dev.vars

if ($failures | is-not-empty) {
    print ""
    print "✗ Some routes did not reach Google:"
    $failures | each {|f| print $"  - ($f)" }
    if ($log | path exists) { print "--- wrangler log tail ---"; open $log | lines | last 15 | str join (char nl) | print }
    exit 1
}
print $"✓ Cloudflare transport smoke OK — all ($routes | length) API routes round-tripped via worker::Fetch."
'''

[tasks."test:cf-live"]
description = "Live end-to-end test with the REAL key (from fnox): boots wrangler dev and asserts /text-search returns actual places via worker::Fetch. Needs GOOGLE_MAPS_API_KEY set (mise run secret:google) + network. Opt-in."
dir = "examples/cf-rest-worker"
shell = "nu -c"
run = '''
let probe = (^fnox get GOOGLE_MAPS_API_KEY | complete)
if $probe.exit_code != 0 {
    print "✗ GOOGLE_MAPS_API_KEY not set — run `mise run secret:google` first."
    exit 1
}
let log = "/tmp/gmaps-cf-live.log"
fnox exec -- nu -c '$"GOOGLE_MAPS_API_KEY=($env.GOOGLE_MAPS_API_KEY)" | save -f .dev.vars'
rm -f $log

let workerd_before = (ps | where name =~ "workerd" | get pid)
let id = (job spawn { ^wrangler dev --local --port 8803 out+err> $log })

mut ready = false
for _ in 1..90 {
    sleep 1sec
    if ($log | path exists) and ((open $log) | str contains "Ready on") { $ready = true; break }
}

mut failure = ""
mut places = 0
if not $ready {
    $failure = "wrangler dev never became ready"
} else {
    # Places (New) text search works without an open billing account.
    let body = (^curl -s "http://localhost:8803/text-search?query=coffee+in+Ottawa")
    let parsed = (try { $body | from json } catch { {} })
    $places = ($parsed | get -o response.places | default [] | length)
    if $places < 1 {
        $failure = $"text-search returned no places — body: ($body | str substring 0..300)"
    }
}

job kill $id
let workerd_after = (ps | where name =~ "workerd" | get pid)
$workerd_after | where {|p| $p not-in $workerd_before} | each {|p| do --ignore-errors { ^kill -9 $p } }
do --ignore-errors { ^pkill -f "localhost:8803" }
rm -f .dev.vars

if ($failure | is-not-empty) {
    print $"✗ ($failure)"
    if ($log | path exists) { open $log | lines | last 15 | str join (char nl) | print }
    exit 1
}
print $"✓ Live worker::Fetch OK — /text-search returned ($places) real places from Google."
print "  (geocoding/directions need an OPEN billing account; Places works without one.)"
'''


# =============================================================================
# test:connectrpc:* — smoke the SAME Connect RPC on both runtimes (native + CF).
# Identical JSON POST to /maps.v1.MapsService/Geocode; dummy key → each must
# reach Google (REQUEST_DENIED), proving the RPC round-trips on that runtime.
# =============================================================================

[tasks."test:connectrpc"]
description = "Smoke the ConnectRPC Maps service on BOTH runtimes (native axum + Cloudflare worker)."
depends = ["test:connectrpc:native", "test:connectrpc:cf"]

[tasks."test:connectrpc:native"]
hide = true
description = "Native axum smoke: run the connectrpc-native server with a dummy key, POST Geocode, assert it reaches Google."
dir = "examples/native-connectrpc"
shell = "nu -c"
run = '''
$env.GOOGLE_MAPS_API_KEY = "cf-smoke-dummy-key"
$env.ADDR = "127.0.0.1:8085"
let log = "/tmp/gmaps-connectrpc-native.log"
rm -f $log
cargo build --quiet
let bin = "./target/debug/google-maps-connectrpc-native-example"
let id = (job spawn { ^$bin out+err> $log })
mut ready = false
for _ in 1..40 { sleep 1sec; if ($log | path exists) and ((open $log) | str contains "listening") { $ready = true; break } }
mut failure = ""
if not $ready {
    $failure = "native server did not start"
} else {
    let body = (^curl -s --max-time 30 -X POST "http://127.0.0.1:8085/maps.v1.MapsService/Geocode" -H "Content-Type: application/json" -d '{"address":"Ottawa"}')
    if not (($body | str downcase) | str contains "denied") { $failure = $"unexpected response: ($body | str substring 0..160)" }
}
job kill $id
do --ignore-errors { ^pkill -f google-maps-connectrpc-native-example }
rm -f $log
if ($failure | is-not-empty) { print $"✗ ($failure)"; exit 1 }
print "✓ native ConnectRPC OK — Geocode RPC round-tripped via reqwest (REQUEST_DENIED with dummy key)."
'''

[tasks."test:connectrpc:cf"]
hide = true
description = "Cloudflare smoke: token gate (no token -> unauthenticated) + valid token -> Geocode reaches Google (dummy key -> REQUEST_DENIED)."
dir = "examples/cf-connectrpc-worker"
shell = "nu -c"
run = '''
"GOOGLE_MAPS_API_KEY=cf-smoke-dummy-key\nMAPS_TOKENS=smoke-token\n" | save -f .dev.vars
let log = "/tmp/gmaps-connectrpc-cf.log"
rm -f $log
let workerd_before = (ps | where name =~ "workerd" | get pid)
let id = (job spawn { ^wrangler dev --local --port 8806 out+err> $log })
mut ready = false
for _ in 1..90 { sleep 1sec; if ($log | path exists) and ((open $log) | str contains "Ready on") { $ready = true; break } }
mut failure = ""
if not $ready {
    $failure = "wrangler dev never became ready"
} else {
    let url = "http://localhost:8806/maps.v1.MapsService/Geocode"
    # 1. No token → the gate must reject (unauthenticated), NEVER reaching Google.
    let no_tok = (^curl -s --max-time 30 -X POST $url -H "Content-Type: application/json" -d '{"address":"Ottawa"}')
    # 2. Valid token → passes the gate, reaches Google (REQUEST_DENIED on dummy key).
    let with_tok = (^curl -s --max-time 30 -X POST $url -H "Content-Type: application/json" -H "Authorization: Bearer smoke-token" -d '{"address":"Ottawa"}')
    if not (($no_tok | str downcase) | str contains "unauthenticated") {
        $failure = $"token gate did NOT reject untokened request: ($no_tok | str substring 0..160)"
    } else if not (($with_tok | str downcase) | str contains "denied") {
        $failure = $"valid-token request did not reach Google: ($with_tok | str substring 0..160)"
    }
}
job kill $id
let workerd_after = (ps | where name =~ "workerd" | get pid)
$workerd_after | where {|p| $p not-in $workerd_before} | each {|p| do --ignore-errors { ^kill -9 $p } }
do --ignore-errors { ^pkill -f "localhost:8806" }
rm -f .dev.vars
if ($failure | is-not-empty) { print $"✗ ($failure)"; exit 1 }
print "✓ Cloudflare ConnectRPC OK — token gate rejects untokened, valid token reaches Google (REQUEST_DENIED)."
'''


# =============================================================================
# example:connectrpc:sizes — compare the built artifact size of the native vs
# Cloudflare ConnectRPC examples (same proto + MapsServer, two runtimes).
# =============================================================================

[tasks."example:connectrpc:sizes"]
description = "Build (release) + report artifact sizes — shows the composition win: a client worker that BINDS over RPC (no google_maps) is far smaller than the server worker that embeds it."
shell = "nu -c"
run = '''
print "Building release artifacts (this can take a minute)…"
cd examples/cf-connectrpc-worker;        worker-build --release out+err> /tmp/gmaps-sz-srv.log; cd ../..
cd examples/cf-connectrpc-client-worker; worker-build --release out+err> /tmp/gmaps-sz-cli.log; cd ../..
cd examples/native-connectrpc;           cargo build --release      out+err> /tmp/gmaps-sz-nat.log; cd ../..

mut rows = []
let cf = [
    {rt: "cloudflare SERVER (wasm, embeds google_maps)",        g: "examples/cf-connectrpc-worker/build/**/*.wasm"}
    {rt: "cloudflare CLIENT (wasm, binds over RPC, NO google_maps)", g: "examples/cf-connectrpc-client-worker/build/**/*.wasm"}
]
for spec in $cf {
    for f in (glob $spec.g) {
        $rows = ($rows | append {runtime: $spec.rt, artifact: ($f | path basename), size: (ls $f | get size.0)})
    }
}
let bin = "examples/native-connectrpc/target/release/google-maps-connectrpc-native-example"
if ($bin | path exists) {
    $rows = ($rows | append {runtime: "native SERVER (binary)", artifact: ($bin | path basename), size: (ls $bin | get size.0)})
}
print "ConnectRPC artifact sizes:"
$rows | print
print "→ A consuming worker binds the CLIENT (tiny); only the shared maps worker embeds google_maps."
'''


# =============================================================================
# web:* — the simple (no-Kumo) reusable web client + demo (web/).
# @joeblew999/google-maps-connect = a framework-agnostic typed Connect client
# generated from the SAME maps.proto; point it at any worker URL (shared or
# project-composed). Kumo/React UI is a deliberately deferred later layer.
# =============================================================================

[tasks."web:install"]
description = "Install the web workspace deps (pnpm)."
dir = "web"
shell = "nu -c"
run = "pnpm install"

[tasks."web:gen"]
description = "Generate the TypeScript Connect client from crates/connectrpc/proto/maps.proto (buf)."
dir = "web/packages/connect"
shell = "nu -c"
run = "buf generate"

[tasks."web:build"]
description = "Build the reusable client + the vanilla demo (regenerates the client first)."
dir = "web/demo"
shell = "nu -c"
depends = ["web:gen"]
run = "pnpm run build"

[tasks."web:dev"]
description = "Run the demo locally (vite). In another terminal run `mise run example:connectrpc:dev` for the worker."
dir = "web/demo"
shell = "nu -c"
depends = ["web:gen"]
run = '''
print "── Local web demo ─────────────────────────────────────────────"
print "  Web (this):     http://localhost:5173"
print "  Maps worker:    http://localhost:8787   ← run `mise run example:connectrpc:dev`"
print "  (the page's URL box defaults to the worker; change it to hit a deployed one)"
print "───────────────────────────────────────────────────────────────"
pnpm run dev
'''

[tasks."web:deploy"]
description = "Build + deploy the web demo to Cloudflare (static assets). Prints the deployed URL."
dir = "web/demo"
shell = "nu -c"
depends = ["web:build"]
run = '''
let out = (fnox exec -- wrangler deploy | complete)
print $out.stdout
$out.stdout | lines | where {|l| ($l | str contains "workers.dev") or ($l | str contains "https://")} | each {|l| print $"🌐 ($l | str trim)"}
'''


# =============================================================================
# proto:* — one source of truth (maps.proto) → Rust + TypeScript codegen.
# Edit crates/connectrpc/proto/maps/v1/maps.proto, then `mise run proto:gen`.
# =============================================================================

[tasks."proto:lint"]
description = "Lint the maps proto (the single contract behind the Rust server, Rust client, and TS client)."
dir = "crates/connectrpc"
shell = "nu -c"
run = "buf lint"

[tasks."proto:gen"]
description = "Regenerate ALL codegen from maps.proto in one shot: Rust (build.rs via cargo) + TypeScript (buf)."
shell = "nu -c"
depends = ["web:gen"]
run = '''
# Rust connect/proto code is produced by build.rs; cargo check refreshes it from
# the updated .proto (client feature = fastest, no google_maps).
cargo check -p google-maps-connectrpc --no-default-features --features client --target $env.WASM_TARGET
print "✓ regenerated Rust (build.rs) + TypeScript (buf) from maps.proto"
'''
